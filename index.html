<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Calculadora de IMC</h1>
        <p>Descubra seu Índice de Massa Corporal</p>
    </header>

    <main>
        <section class="cartao">

            <form id="formulario-imc">
                <div class="campo">
                    <label for="peso">Peso (kg)</label>
                    <input type="number" id="peso" placeholder="Ex: 70" step="0.1">
                </div>

                <div class="campo">
                    <label for="altura">Altura (m)</label>
                    <input type="number" id="altura" placeholder="Ex: 1.75" step="0.01">
                </div>

                <div class="botoes">
                    <button type="button" id="btn-calcular">Calcular</button>
                    <button type="button" id="btn-limpar" class="secundario">Limpar</button>
                </div>
            </form>

            <div id="resultado" class="resultado oculto"></div>

        </section>

        <section class="cartao">
            <h2>Tabela de referência</h2>
            <table>
                <thead>
                    <tr><th>IMC</th><th>Classificação</th></tr>
                </thead>
                <tbody>
                    <tr><td>Menor que 18,5</td><td>Abaixo do peso</td></tr>
                    <tr><td>18,5 a 24,9</td><td>Peso normal</td></tr>
                    <tr><td>25 a 29,9</td><td>Sobrepeso</td></tr>
                    <tr><td>30 ou mais</td><td>Obesidade</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>Atividade prática – HTML, CSS e JavaScript</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
